; WaterProbe settings. Re-read every second, so you can change them while the game runs.
; iExperiment: 0 = only log
;              1 = multiply the MATERIAL amplitude of the water type you stand in by 3 (does the engine keep it or overwrite it?)
;              2 = multiply the RECORD noise wind speed of that water type by 5 and set needUpdate (does it reach the material?)
; Setting it back to 0 undoes the change.
[Probe]
iExperiment=0
bAllTypes=1
iMaxTypes=10
