; WaterWade 0.1: wading slows actors by how deep they are in the water, armor adds to the swim penalty, and the player's
; splash rings grow with how fast the player moves through the water. Re-read every second, edit it while the game runs.
[Wading]
bSlowdown=1
; 1 = only the player is slowed, 0 = every actor (NPCs, followers, horses) is
bPlayerOnly=0
; slowdown in percent of the normal speed: ankle deep (submerged level 0.2), waist deep (about 0.55), swimming (0.69 and deeper)
fSmallSlowdownPercent=8
fLargeSlowdownPercent=25
fSwimSlowdownPercent=10
fSwimLevel=0.69
; the speed multiplier never drops below this
fMinSpeedMultiplier=0.10
; share of the armor penalty below that also applies while wading (0 = swimming only, 1 = the full penalty at swim depth)
fArmorWadeFactor=0.0

[ArmorSwimPenalty]
; subtracted from the speed multiplier while swimming, per worn piece
fHeavyBody=0.14
fLightBody=0.07
fClothBody=0.023
fHeavyFeet=0.07
fLightFeet=0.03
fClothFeet=0.01
fHeavyHands=0.05
fLightHands=0.02
fClothHands=0.007
fHeavyHead=0.02
fLightHead=0.01
fClothHead=0.003

[Wake]
; grow the engine's own wading wake patch (the square of simulated water around a wading actor, game setting fWadingWaterQuadSize) with the player's speed:
; 1 = on; the patch is this many times its normal size at fWakeMaxSpeed
bWakePatch=1
; wake HEIGHT: the water type you stand in has a displacement simulator (starting size and force in its record); these raise them with your speed.
; Force is what makes the wake rise. 3 = three times the record's value at fWakeMaxSpeed. Size 1 = unchanged.
bWakeHeight=0
fWakeHeightMaxScale=3.0
fWakeSizeMaxScale=1.0

fWakePatchMaxScale=2.0
; extra rain-style ring stamps from the engine's ripple call: they come out as long streaks, so off
bWake=0
; player speed in game units per second (walking is about 130, running about 400): no extra rings below Min, biggest rings at Max
fWakeMinSpeed=60
fWakeMaxSpeed=450
; ring size at the minimum and the maximum speed (the scale handed to the engine's own ripple call)
fWakeScaleMin=0.08
fWakeScaleMax=0.5
; seconds between rings at the minimum speed (up to 60% shorter at the maximum speed)
fWakeInterval=0.25
; submerged level the player needs before rings are placed (0.12 is about ankle to shin deep)
fWakeMinDepth=0.12
; write a line to WaterWade.log every N seconds while in water (0 = off)
iLogSeconds=0

[Splash]
; spawns the engine's own water splash mesh at the water surface under the player
bSplash=1
; speed in units per second (running is about 340) at which stepping or jumping into water makes a splash
fSplashEntrySpeed=180
; running faster than this in knee to waist deep water keeps splashing, one every fSplashInterval seconds
fSplashRunSpeed=280
fSplashInterval=0.45
; the splash mesh (the one the game plays when an arrow hits water) and its size: scale at the thresholds above, and at 600 units per second and faster
; test 1: a plain vanilla dust puff, to see that anything spawns. Then try Effects\fxsplashsmallparticles.nif and Effects\fxsplashheavy.nif, and the original Effects\waterSplash.nif
sSplashModel=Effects\ImpactEffects\FootImpactDust01.nif
fSplashScaleMin=0.45
fSplashScaleMax=1.0
fSplashLifetime=1.0
iSplashFlags=7

; debug: 1 = every second, spawn the effect 150 units in front of you at head height, in or out of water, to see whether any spawned effect is visible at all
iSplashDebug=0

; the splash objects placed at the water surface (MoveableStatics in Skyrim.esm; your CS Water Mod re-skins their meshes): small below fSplashBigSpeed, heavy at or above it
sSplashSmallForm=02BCA5
sSplashBigForm=0FD0D1
fSplashBigSpeed=450

[ShipWake]
; a wake for Vicn's Animated Ships (and any model whose path contains sShipModelMatch). The ships' own files are not touched:
; the plugin follows the moving ship and adds the engine's ripple and a splash at its bow while it sails.
bShipWake=0
sShipModelMatch=animatedship
; ships farther than this from the player get no wake
fShipRadius=9000
; speed (units per second) below which a ship counts as still, and at which the wake is at full size
fShipMinSpeed=25
fShipMaxSpeed=400
; bow offset along the heading, as a share of the ship's bounding radius
fShipBowFraction=0.55
fShipRippleInterval=0.20
fShipRippleScaleMin=1.5
fShipRippleScaleMax=4.0
bShipSplash=0
fShipSplashInterval=0.7
fShipSplashScaleMin=0.7
fShipSplashScaleMax=1.8
fShipSplashLifetime=1.2
sShipSplashForm=02BCA5
; 1 = WaterWade.log lists the ships it finds (position, bound, speed) every few seconds, to tune the settings above
iShipDebug=0

; V wake: two ripple arms from the bow opening backwards. Half opening angle in degrees, arm length in ship lengths, ripples per arm, their size relative to the bow ripple
fShipVAngle=19
fShipVLength=1.6
iShipVPoints=7
fShipVScale=1.6
; the ships carry their own bow splash and stern bubbles; 1 = add WaterWade's splash at the bow as well
bShipBowSplash=0

; foam V mesh attached under each ship's moving hull node (Meshes\Effects\CSWater\ShipWake.nif in this mod). Moves, turns and bobs with the ship.
bShipMesh=1
sShipMeshPath=Effects\CSWater\ShipWake.nif
; height above the waterline, and a size multiplier (the V is fSipVLength ship lengths long)
fShipMeshZ=4
fShipMeshScale=1.0
; the engine ripple at the bow only shows near the player and comes out as streaks: off
bShipRipples=0
