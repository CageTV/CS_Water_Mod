; WaterWind 0.2: open water responds to the weather's wind. Re-read every second, edit it while the game runs.
; Two things change with the wind:
;   - scroll speed of the three normal-map layers (water record value), and
;   - wave height (amplitude of those layers, written on each live water material).
; Both are scaled by a curve that is 1 (the water's own values) at fReferenceWind, goes down to the "Calm" scale in no wind and up to
; the "Storm" scale in a gale. Wind is 0..1 (a weather's wind speed / 255). In this load order: Fog 0.05, Clear 0.10, Cloudy 0.15,
; Storm Rain 0.20, Overcast Snow 0.30, Storm Snow 0.70.
[WaterWind]
bEnabled=1
; 0 = wind from the weather records (steady, follows weather changes), 1 = the sky's live wind (includes gusts)
iWindSource=0
fCalmWind=0.01
fReferenceWind=0.02
fStormWind=0.03
; rainy and snowy weathers have low wind values; this is added to them so a rain storm gets choppy
fPrecipitationWindBonus=0.10
fCalmSpeedScale=0.40
fStormSpeedScale=4.0
fCalmAmplitudeScale=0.55
fStormAmplitudeScale=6.0
; seconds of smoothing, so a weather change eases in instead of jumping
fSmoothingSeconds=8
; water types with Enable Flowmap (rivers) keep their own values unless this is 1
bRecordAmplitude=0
fDepthNormals=-1
bTextureFix=1
bDriveStalledScroll=1
bAffectFlowmapWater=1
iLogSeconds=30
